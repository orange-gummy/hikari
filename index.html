<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>光の手前で</title>
<meta name="theme-color" content="#04050C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="光の手前で">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Jura:wght@300;400;500&family=Murecho:wght@200;300;400&family=Shippori+Mincho+B1:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="app">
  <header id="hud">
    <div id="hudL"><div class="lab" id="hLab">VELOCITY</div><div class="num" id="hV">0%</div><div id="hG">光速の0%</div></div>
    <svg id="cons" width="130" height="46" viewBox="0 0 130 46" aria-label="故郷の色の記憶"></svg>
    <div id="hudR"><div class="lab" id="hrLab">HOME</div><div class="num"><span id="yrU0" class="small"></span><span id="yr">0</span><span class="small" id="yrU"> 年</span></div><div class="num" id="yrRate"></div><div id="mem"></div></div>
    <button id="gear" aria-label="設定"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  </header>
  <div id="route" aria-label="故郷への航路">
    <div id="rLine"></div><div id="rDone"></div><div id="rTicks"></div><div id="rNames"></div>
    <svg id="rShip" viewBox="0 0 12 13" aria-hidden="true"><path d="M6 1L11 12L6 9L1 12Z" fill="none" stroke="#f6f7fb" stroke-width="1" transform="rotate(90 6 6.5)"/></svg>
    <div id="rHome"></div>
    <div id="rInfo"><span>区域　<b id="rReg">母港の外縁</b></span><span><span id="dsTo">故郷まで</span> <b class="num" id="ds">10,000</b> 光年</span></div>
  </div>
  <main id="frame" aria-label="船窓。タップでエネルギーを集める">
    <i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i>
    <div id="accBig"></div>
    <div id="ringWrap"><svg id="ring" viewBox="0 0 176 176"></svg><div id="spd"><div id="spdL">ENERGY</div><div id="spdV"><span id="eV">0</span><span id="eU"></span></div><div id="rate">+0 / 秒</div><div id="spdG">秒速0km</div></div></div>
    <div id="goal"><span class="lab">目標</span><span id="goalT"></span></div>
    <div id="toasts"></div>
    <div id="sub"><div id="subT"></div></div>
  </main>
  <section id="panel">
    <div id="pbody"></div>
    <nav id="tabs" role="tablist">
      <div class="tr" id="tr1"></div>
      <div class="tr" id="tr2"></div>
    </nav>
  </section>
</div>
<div id="skillOv" role="dialog" aria-label="スキル"><div id="skHead"><span class="lab">SKILL</span><span id="skTitle" style="font-size:13px"></span><span class="num" id="skW"></span><span id="skWm"></span><button id="skX" aria-label="星図を閉じる">×</button></div><div id="skBody"></div></div>
<div id="block"></div>
<div class="modal" id="mWelcome"><div class="mbox"><h2>おかえり</h2><div id="wBody"></div><button class="act" id="wOk">受け取る</button></div></div>
<div class="modal" id="mConfirm"><div class="mbox"><h2 id="cTitle"></h2><div id="cBody" class="note"></div><div class="duo"><button class="act" id="cNo">やめる</button><button class="act" id="cYes">実行する</button></div></div></div>
<div class="modal" id="mSet"><div class="mbox"><h2>設定</h2>
  <div class="note">開発用の早送り（遊びの速さを確認するための機能です）</div>
  <div class="seg" id="spdSeg"><button data-m="1">×1</button><button data-m="10">×10</button><button data-m="100">×100</button><button data-m="1000">×1000</button></div>
  <div class="note" style="margin-top:14px">演出の強さ（揺れとフラッシュ）</div>
  <div class="seg" id="fxSeg"><button data-f="0">標準</button><button data-f="1">控えめ</button></div>
  <div class="note" style="margin-top:14px">音</div>
  <div class="seg" id="sndSeg"><button data-v="0">切</button><button data-v="0.35">小</button><button data-v="0.7">中</button><button data-v="1">大</button></div>
  <div class="note" style="margin-top:14px">数字の表記</div>
  <div class="seg" id="numSeg"><button data-n="0">2.47e8</button><button data-n="1">2.47億</button></div>
  <div class="note" style="margin-top:14px">セーブの書き出しと読み込み</div>
  <textarea id="saveTxt" aria-label="セーブデータ"></textarea>
  <div class="duo"><button class="act" id="sExp">書き出す</button><button class="act" id="sImp">読み込む</button></div>
  <button class="act" id="sEnd" style="opacity:.8">最後の場面だけ見る（確認用・進行は変わらない）</button>
  <button class="act" id="sReset" style="opacity:.6">最初からやり直す</button>
  <button class="act" id="sClose">閉じる</button></div></div>
<button id="skipC" style="display:none">スキップ</button>
<div id="ending"><div id="endLine">空は、こんな色だった。</div></div>
<div id="title"><button id="tGear" aria-label="設定"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button><h1>光の手前で</h1><div class="note" style="text-align:center">帰り道は、まだ覚えている。</div><button class="act" id="tAgain">もう一度、船を出す</button><button class="act" id="tFar" style="display:none">さらに遠くへ</button><button class="act" id="tNew">最初から遊ぶ</button><button class="act" id="tBack" style="display:none">確認を終える</button></div>
<script src="src/data.js"></script>
<script src="src/state.js"></script>
<script src="src/economy.js"></script>
<script src="src/story.js"></script>
<script src="src/sound.js"></script>
<script src="src/render/scene.js"></script>
<script src="src/render/sky.js"></script>
<script src="src/ui/common.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/ui/panel.js"></script>
<script src="src/ui/skills.js"></script>
<script src="src/ui/settings.js"></script>
<script src="src/climax.js"></script>
<script src="src/main.js"></script>
</body>
</html>
